<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pomodoist - Speak your mind</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .voice-step { position: absolute; top: 560px; margin: 0; font: 500 76px/1.05 Georgia, serif; letter-spacing: 0; }
    .voice-step.first { left: 192px; width: 1040px; }
    .voice-step.last { left: 1376px; width: 1312px; }
    .voice-art { position: absolute; left: 160px; top: 690px; width: 1150px; height: 900px; object-fit: contain; }
    .screen { left: 1376px; top: 690px; width: 1312px; height: 868px; overflow: visible; border-radius: 0; outline: none; background: transparent; box-shadow: none; }
    .screen img { height: 100%; object-fit: contain; transform: scale(1.25); transform-origin: top center; }
    .voice-note { position: absolute; left: 192px; top: 1640px; margin: 0; font: 500 46px/1.2 -apple-system, BlinkMacSystemFont, sans-serif; letter-spacing: 0; }
  </style>
</head>
<body>
  <main class="slide">
    <header class="copy"><h1>Speak your mind.</h1><p class="subtitle">Turn thoughts into tasks. Keep the final say.</p></header>
    <h2 class="voice-step first">Say it once.</h2>
    <img class="voice-art" src="../assets/voice-to-tasks.png" alt="Sculpted ivory microphone with a flowing audio ribbon and paper task slips">
    <h2 class="voice-step last">Make it a task.</h2>
    <div class="screen"><img src="../assets/voice-analysis-to-tasks.png" alt="Illustrated Pomodoist voice workflow: recognized speech is split into three editable tasks, then reviewed before Add 3"></div>
    <p class="voice-note">Your words. Your tasks. Your final say.</p>
  </main>
</body>
</html>
