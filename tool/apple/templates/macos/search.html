<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pomodoist - Search, Projects and Labels</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .screen { left: 720px; top: 590px; width: 1440px; height: 942.4px; margin: 0; border-radius: 24px; box-shadow: 0 36px 85px #4e090856; }
    .screen img { width: 3888px; left: -1224px; top: -749.25px; }
    .organization-art { position: absolute; top: 790px; width: 440px; height: 440px; overflow: hidden; }
    .organization-art img { position: absolute; top: 0; width: 1320px; height: 440px; max-width: none; }
    .organization-art.projects { left: 192px; }
    .organization-art.projects img { left: -440px; }
    .organization-art.labels { left: 2248px; }
    .organization-art.labels img { left: -880px; }
    .feature-info { position: absolute; left: 192px; top: 1550px; width: 2496px; display: grid; grid-template-columns: 440px 1440px 440px; gap: 88px; }
    .feature-info section { border-top: 2px solid #11111130; text-align: center; }
    .feature-info .side-info { transform: translateY(-310px); }
    .info-title { margin: 26px 0 0; font: 500 70px/1.05 Georgia, serif; letter-spacing: 0; }
    .info-copy { max-width: 650px; margin: 24px auto 0; font: 470 44px/1.25 -apple-system, BlinkMacSystemFont, sans-serif; letter-spacing: 0; }
    .side-info .info-title { font-size: 60px; }
    .side-info .info-copy { max-width: 400px; font-size: 38px; }
  </style>
</head>
<body>
  <main class="slide">
    <header class="copy"><h1>Search</h1><p class="subtitle">Tasks, projects and labels.</p></header>
    <div class="organization-art projects"><img src="../assets/search-projects-labels.png" alt="Sculpted project folder"></div>
    <div class="organization-art labels"><img src="../assets/search-projects-labels.png" alt="Sculpted label tags"></div>
    <figure class="screen"><img src="screenshots/09-search-dark.png" alt="Actual Pomodoist Search using the original screenshot crop"></figure>
    <div class="feature-info">
      <section class="side-info"><h2 class="info-title">Projects</h2><p class="info-copy">Keep tasks grouped by goal.</p></section>
      <section><h2 class="info-title">Search</h2><p class="info-copy">Find tasks and projects.</p></section>
      <section class="side-info"><h2 class="info-title">Labels</h2><p class="info-copy">Group related tasks across projects.</p></section>
    </div>
  </main>
</body>
</html>
