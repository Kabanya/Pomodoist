<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pomodoist — Upcoming Planner</title>
  <link rel="stylesheet" href="style.css">

</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="pomo-outline" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
        <feMorphology in="SourceAlpha" operator="dilate" radius="3" result="expanded"/>
        <feFlood flood-color="#111111" result="ink"/>
        <feComposite in="ink" in2="expanded" operator="in" result="silhouette"/>
        <feMerge><feMergeNode in="silhouette"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
  </svg>
  <main class="slide hero">
    <img class="pomo-greeting" src="../assets/pomo-greeting.png" alt="Pomo smiling and waving hello">
    <div class="eyebrow open-source">
      <!-- GitHub glyph from the installed Lucide icon set (ISC). -->
      <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2" fill="none"/></svg>
      <span>Open Source</span>
    </div>
    <div class="eyebrow">Upcoming Planner</div><header class="copy">

      <h1>Turn thoughts<br>into tasks —<br>and get them done</h1>
    </header>
    <div class="voice"><img src="../assets/voice-calendar-pomodoro-v2.png" alt="Sculpted microphone, calendar and tomato-shaped Pomodoro timer connected by an ivory audio ribbon"></div>
    <div class="flow" aria-label="Voice input to Google Calendar to Pomodoro">
      <div class="feature"><span class="index">01</span>Voice input</div>
      <div class="feature"><span class="index">02</span>Google Calendar</div>
      <div class="feature"><span class="index">03</span>Pomodoro</div>
    </div>
    <div class="theme-labels"><span>Light</span><span>Dark</span></div><div class="screen-shell"><div class="screen-clip">
      <img class="screenshot" src="screenshots/20261023/01-upcoming-planner-light.png" alt="Actual Pomodoist Upcoming Planner in light mode">
      <img class="screenshot theme-dark" src="screenshots/20261023/01-upcoming-planner-dark.png" alt="Actual Pomodoist Upcoming Planner in dark mode">
      <div class="seam"></div>
    </div></div>
  </main>
</body>
</html>
