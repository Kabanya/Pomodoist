<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pomodoist - Search, Projects and Labels</title>
  <link rel="stylesheet" href="style.css">

</head>
<body>
  <main class="slide search-slide">
    <header class="copy"><h1>Search</h1><p class="subtitle">Tasks, projects and labels.</p></header>
    <div class="organization-art projects"><img src="../assets/search-projects-labels.png" alt="Sculpted project folder"></div>
    <div class="organization-art labels"><img src="../assets/search-projects-labels.png" alt="Sculpted label tags"></div>
    <div class="screen-shell"><div class="screen-clip"><img class="screenshot" src="screenshots/20261023/09-search-dark.png" alt="Actual Pomodoist Search on iPhone"></div></div>
    <div class="feature-info">
      <section class="side-info projects"><h2 class="info-title">Projects</h2><p class="info-copy">Keep tasks grouped by goal.</p></section>
      <section class="search-info"><h2 class="info-title">Search</h2><p class="info-copy">Find tasks and projects.</p></section>
      <section class="side-info labels"><h2 class="info-title">Labels</h2><p class="info-copy">Group related tasks across projects.</p></section>
    </div>
  </main>
</body>
</html>
