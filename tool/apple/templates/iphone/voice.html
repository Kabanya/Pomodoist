<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pomodoist - Speak your mind</title>
  <link rel="stylesheet" href="style.css">

</head>
<body>
  <main class="slide">
    <header class="copy"><h1>Speak your<br>mind.</h1><p class="subtitle">Turn thoughts into tasks. Keep the final say.</p></header>
    <h2 class="voice-step first">Say it once.</h2>
    <img class="voice-art" src="../assets/voice-to-tasks.png" alt="Sculpted ivory microphone with a flowing audio ribbon and paper task slips">
    <h2 class="voice-step last">Make it a task.</h2>
    <div><img class="workflow-art" src="../assets/voice-analysis-to-tasks.png" alt="Illustrated Pomodoist voice workflow: recognized speech is split into three editable tasks, then reviewed before Add 3"></div>
    <p class="voice-note">Your words. Your tasks. Your final say.</p>
  </main>
</body>
</html>
