name: Linux AppImage release

on:
  workflow_dispatch:
    inputs:
      flavors:
        description: Linux flavors to build
        type: choice
        default: production
        options:
          - production
          - all
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-test-publish:
    name: Build, test, and publish ${{ matrix.flavor }} x86_64 AppImage
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:22.04@sha256:3b06811b2afd352be909dd088a004166d665dc76d38b13eada33522a9d915c6f
    environment: windows-production
    defaults:
      run:
        shell: bash
    # A tag push publishes the production AppImage; `all` also builds the
    # development and staging identities for testing.
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJSON(inputs.flavors == 'all' && '["development","staging","production"]' || '["production"]') }}
    env:
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.GOOGLE_DESKTOP_CLIENT_ID }}
      GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
    steps:
      - name: Install Linux build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            appstream \
            bash \
            ca-certificates \
            clang \
            cmake \
            curl \
            desktop-file-utils \
            file \
            git \
            gh \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-pulseaudio \
            libcurl4-openssl-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer1.0-dev \
            libgtk-3-dev \
            liblzma-dev \
            libsecret-1-dev \
            jq \
            make \
            ninja-build \
            openjdk-17-jdk \
            pkg-config \
            python3 \
            unzip \
            xz-utils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Prepare application version
        id: version
        shell: bash
        run: |
          pubspec_version=$(awk '/^version:/ {sub(/\r$/, ""); print $2; exit}' apps/flutter/pubspec.yaml)
          if [[ ! "$pubspec_version" =~ ^.+\+([0-9]+)$ ]]; then
            echo 'apps/flutter/pubspec.yaml must contain a numeric build number after +.' >&2
            exit 64
          fi
          build_number="${BASH_REMATCH[1]}"
          release_version="${pubspec_version%+*}"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            number='(0|[1-9][0-9]*)'
            if [[ ! "$GITHUB_REF_NAME" =~ ^v$number\.$number\.$number(-rc\.$number)?$ ]]; then
              echo 'Release tags must use vX.Y.Z or vX.Y.Z-rc.N.' >&2
              exit 64
            fi
            release_version="${GITHUB_REF_NAME#v}"
            awk -v version="$release_version+$build_number" '
              /^version:/ {$0 = "version: " version}
              {sub(/\r$/, ""); print}
            ' apps/flutter/pubspec.yaml > apps/flutter/pubspec.yaml.tmp
            mv apps/flutter/pubspec.yaml.tmp apps/flutter/pubspec.yaml
          fi
          echo "POMODOIST_VERSION=$release_version" >> "$GITHUB_ENV"
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
      - name: Trust Flutter SDK and checkout in the Linux container
        run: |
          flutter_root="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")"
          git config --global --add safe.directory "$flutter_root"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Resolve Flutter dependencies
        # make linux-pub-get links the Flutter build and .dart_tool paths into
        # the repository-root build directory before resolving, and retries
        # through the same helper the local Linux targets use.
        run: make linux-pub-get
      - name: Validate and create production configuration
        if: matrix.flavor == 'production'
        run: |
          test -n "$TURNSTILE_SITE_KEY" || {
            echo 'TURNSTILE_SITE_KEY is required.' >&2
            exit 1
          }
          case "$GOOGLE_DESKTOP_CLIENT_ID" in
            *.apps.googleusercontent.com) ;;
            *)
              echo 'GOOGLE_DESKTOP_CLIENT_ID is required.' >&2
              exit 1
              ;;
          esac

          jq --null-input \
            --arg turnstile "$TURNSTILE_SITE_KEY" \
            --arg sentry "$SENTRY_DSN" \
            --arg google_id "$GOOGLE_DESKTOP_CLIENT_ID" \
            --arg google_secret "$GOOGLE_DESKTOP_CLIENT_SECRET" \
            '{
              POMODOIST_ENVIRONMENT: "production",
              WEB_APP_URL: "https://app.pomodoist.com",
              POMODOIST_REGISTRATION_URL: "https://app.pomodoist.com/auth/challenge",
              TURNSTILE_SITE_KEY: $turnstile,
              SENTRY_DSN: $sentry,
              GOOGLE_DESKTOP_CLIENT_ID: $google_id,
              GOOGLE_DESKTOP_CLIENT_SECRET: $google_secret
            }' > "$RUNNER_TEMP/linux-production.json"
      - name: Validate and create development or staging configuration
        if: matrix.flavor != 'production'
        env:
          DEV_WEB_APP_URL: ${{ vars.DEV_WEB_APP_URL }}
          DEV_SUPABASE_URL: ${{ vars.DEV_SUPABASE_URL }}
          DEV_SUPABASE_ANON_KEY: ${{ vars.DEV_SUPABASE_ANON_KEY }}
          DEV_TURNSTILE_SITE_KEY: ${{ vars.DEV_TURNSTILE_SITE_KEY }}
          DEV_SENTRY_DSN: ${{ vars.DEV_SENTRY_DSN }}
          STAGING_SUPABASE_ANON_KEY: ${{ vars.STAGING_SUPABASE_ANON_KEY }}
          STAGING_TURNSTILE_SITE_KEY: ${{ vars.STAGING_TURNSTILE_SITE_KEY }}
          STAGING_SENTRY_DSN: ${{ vars.STAGING_SENTRY_DSN }}
        run: |
          require() {
            test -n "${!1}" || {
              echo "$1 is required to build the ${{ matrix.flavor }} flavor." >&2
              exit 1
            }
          }
          case "${{ matrix.flavor }}" in
            development)
              require DEV_WEB_APP_URL
              environment='local'
              web_app_url="$DEV_WEB_APP_URL"
              registration_url=''
              supabase_url="$DEV_SUPABASE_URL"
              supabase_anon_key="$DEV_SUPABASE_ANON_KEY"
              turnstile="$DEV_TURNSTILE_SITE_KEY"
              sentry="$DEV_SENTRY_DSN"
              ;;
            staging)
              require STAGING_SUPABASE_ANON_KEY
              require STAGING_TURNSTILE_SITE_KEY
              environment='staging'
              web_app_url='https://app-test.pomodoist.com'
              registration_url='https://app-test.pomodoist.com/auth/challenge'
              supabase_url='https://supabase-test.pomodoist.com'
              supabase_anon_key="$STAGING_SUPABASE_ANON_KEY"
              turnstile="$STAGING_TURNSTILE_SITE_KEY"
              sentry="$STAGING_SENTRY_DSN"
              ;;
            *)
              echo "Unknown Linux flavor: ${{ matrix.flavor }}" >&2
              exit 64
              ;;
          esac
          if [[ -n "$supabase_url" && -z "$supabase_anon_key" ]] ||
            [[ -z "$supabase_url" && -n "$supabase_anon_key" ]]; then
            echo 'SUPABASE_URL and SUPABASE_ANON_KEY must be supplied together.' >&2
            exit 1
          fi

          jq --null-input \
            --arg environment "$environment" \
            --arg web_app_url "$web_app_url" \
            --arg registration_url "$registration_url" \
            --arg supabase_url "$supabase_url" \
            --arg supabase_anon_key "$supabase_anon_key" \
            --arg turnstile "$turnstile" \
            --arg sentry "$sentry" \
            '{
              POMODOIST_ENVIRONMENT: $environment,
              WEB_APP_URL: $web_app_url,
              POMODOIST_REGISTRATION_URL: $registration_url,
              SUPABASE_URL: $supabase_url,
              SUPABASE_ANON_KEY: $supabase_anon_key,
              TURNSTILE_SITE_KEY: $turnstile,
              SENTRY_DSN: $sentry
            }' > "$RUNNER_TEMP/linux-${{ matrix.flavor }}.json"
      - name: Test Linux packaging contracts
        run: make test-linux-packaging
      - name: Build production AppImage
        if: matrix.flavor == 'production'
        run: |
          make linux-appimage \
            LINUX_CONFIG="$RUNNER_TEMP/linux-production.json" \
            POMODOIST_RELEASE="$GITHUB_SHA"
      - name: Build development or staging AppImage
        if: matrix.flavor != 'production'
        run: |
          case "${{ matrix.flavor }}" in
            development) target='lib/main_development.dart' ;;
            staging) target='lib/main_staging.dart' ;;
            *)
              echo "Unknown Linux flavor: ${{ matrix.flavor }}" >&2
              exit 64
              ;;
          esac
          make linux-appimage \
            LINUX_RELEASE_TARGET="$target" \
            LINUX_CONFIG="$RUNNER_TEMP/linux-${{ matrix.flavor }}.json" \
            POMODOIST_RELEASE="$GITHUB_SHA"
      - name: Verify AppImage checksum
        run: |
          source tool/linux/flavor.sh
          artifact="$(pomodoist_flavor_artifact_name "${{ matrix.flavor }}")"
          cd build/flutter/linux/appimage
          sha256sum --check "$artifact.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.flavor == 'production' && 'pomodoist-linux-appimage-x86_64' || format('pomodoist-linux-appimage-{0}-x86_64', matrix.flavor) }}
          path: |
            build/flutter/linux/appimage/Pomodoist*-x86_64.AppImage
            build/flutter/linux/appimage/Pomodoist*-x86_64.AppImage.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload AppImage and publish complete desktop release
        if: github.ref_type == 'tag' && matrix.flavor == 'production'
        env:
          RELEASE_NOTES_API_KEY: ${{ secrets.RELEASE_NOTES_API_KEY }}
        run: |
          release_notes='Official Pomodoist desktop release. Linux is distributed as a portable x86_64 AppImage. The Windows installer is unsigned, so Microsoft Defender SmartScreen may warn about an unknown publisher.'
          prerelease=false
          latest=true
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then
            prerelease=true
            latest=false
          fi
          release_id=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id")
          if [[ -z "$release_id" ]]; then
            if generated_notes=$(python3 tool/release_notes.py); then
              release_notes="$generated_notes"
            fi
            release_id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              --raw-field tag_name="$GITHUB_REF_NAME" \
              --field draft=true \
              --field prerelease="$prerelease" \
              --raw-field target_commitish="$GITHUB_SHA" \
              --raw-field name="Pomodoist $GITHUB_REF_NAME" \
              --raw-field body="$release_notes" \
              --jq '.id')
          fi
          for asset in Pomodoist-x86_64.AppImage Pomodoist-x86_64.AppImage.sha256; do
            asset_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
              --jq ".[] | select(.name == \"$asset\") | .id")
            if [[ -n "$asset_id" ]]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" --silent
            fi
            gh api --method POST \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$asset" \
              --header 'Content-Type: application/octet-stream' \
              --input "build/flutter/linux/appimage/$asset" \
              --silent
          done
          required_assets=(
            Pomodoist-x86_64.AppImage
            Pomodoist-x86_64.AppImage.sha256
            Pomodoist-Setup.exe
            Pomodoist-Setup.exe.sha256
            Pomodoist-macOS.dmg
            Pomodoist-macOS.dmg.sha256
            Pomodoist-Android.apk
            Pomodoist-Android.apk.sha256
          )
          asset_names=$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
            --jq '.[].name')
          for required_asset in "${required_assets[@]}"; do
            if ! grep -Fqx -- "$required_asset" <<< "$asset_names"; then
              echo 'Release remains draft until all release assets are present.'
              exit 0
            fi
          done
          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            --raw-field tag_name="$GITHUB_REF_NAME" \
            --field draft=false \
            --field prerelease="$prerelease" \
            --raw-field make_latest="$latest" \
            --silent
