name: Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-ref:
    name: Require main branch or release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Reject unsupported ref
        run: |
          number='(0|[1-9][0-9]*)'
          if [[ "$GITHUB_REF" != refs/heads/main && ! "$GITHUB_REF" =~ ^refs/tags/v$number\.$number\.$number(-rc\.$number)?$ ]]; then
            echo 'Windows builds require main, vX.Y.Z, or vX.Y.Z-rc.N.' >&2
            exit 64
          fi

  build-test:
    name: Build and smoke test unsigned EXE
    needs: validate-ref
    runs-on: windows-2022
    environment: windows-production
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare application version
        id: version
        shell: bash
        run: |
          pubspec_version=$(awk '/^version:/ {sub(/\r$/, ""); print $2; exit}' pubspec.yaml)
          if [[ ! "$pubspec_version" =~ ^.+\+([0-9]+)$ ]]; then
            echo 'pubspec.yaml must contain a numeric build number after +.' >&2
            exit 64
          fi
          build_number="${BASH_REMATCH[1]}"
          release_version="${pubspec_version%+*}"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            number='(0|[1-9][0-9]*)'
            if [[ ! "$GITHUB_REF_NAME" =~ ^v$number\.$number\.$number(-rc\.$number)?$ ]]; then
              echo 'Release tags must use vX.Y.Z or vX.Y.Z-rc.N.' >&2
              exit 64
            fi
            release_version="${GITHUB_REF_NAME#v}"
            awk -v version="$release_version+$build_number" '
              /^version:/ {$0 = "version: " version}
              {sub(/\r$/, ""); print}
            ' pubspec.yaml > pubspec.yaml.tmp
            mv pubspec.yaml.tmp pubspec.yaml
          fi
          echo "POMODOIST_VERSION=$release_version" >> "$GITHUB_ENV"
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
      - run: flutter pub get
      - name: Test installer packaging boundary
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File .\tool\windows\installer\test.ps1
      - name: Install Inno Setup 6.7.1
        run: |
          choco install innosetup --version=6.7.1 --yes --no-progress
          if (@(0, 1641, 3010) -notcontains $LASTEXITCODE) {
            throw "Chocolatey failed with exit code $LASTEXITCODE."
          }
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw "Pinned Inno Setup compiler was not found: $compiler"
          }
          $expectedCompilerHash = 'EB6F4410C8DB367A5F74127E8025AD2CCACC0AFABBE783959D237DF3050F97FB'
          $actualCompilerHash = (
            Get-FileHash -LiteralPath $compiler -Algorithm SHA256
          ).Hash
          if ($actualCompilerHash -cne $expectedCompilerHash) {
            throw "Inno Setup compiler hash mismatch: $actualCompilerHash"
          }
      - name: Validate and write production configuration
        env:
          WEB_APP_URL: ${{ vars.WEB_APP_URL }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          $required = @('WEB_APP_URL', 'TURNSTILE_SITE_KEY', 'GOOGLE_DESKTOP_CLIENT_ID')
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "$name is required in the windows-production environment."
            }
          }
          $config = [ordered]@{
            POMODOIST_ENVIRONMENT = 'production'
            WEB_APP_URL = $env:WEB_APP_URL
            POMODOIST_REGISTRATION_URL = 'https://app.pomodoist.com/auth/challenge'
            TURNSTILE_SITE_KEY = $env:TURNSTILE_SITE_KEY
            SENTRY_DSN = $env:SENTRY_DSN
            GOOGLE_DESKTOP_CLIENT_ID = $env:GOOGLE_DESKTOP_CLIENT_ID
            GOOGLE_DESKTOP_CLIENT_SECRET = $env:GOOGLE_DESKTOP_CLIENT_SECRET
          }
          $config | ConvertTo-Json | Set-Content `
            -LiteralPath "$env:RUNNER_TEMP\windows-production.json" `
            -Encoding utf8
      - name: Build Flutter release
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File .\tool\windows\build.ps1
          -Configuration Release
          -ConfigFile "$env:RUNNER_TEMP\windows-production.json"
          -ReleaseSha $env:GITHUB_SHA
      - name: Remove production configuration
        if: always()
        run: >-
          Remove-Item
          -LiteralPath "$env:RUNNER_TEMP\windows-production.json"
          -Force
          -ErrorAction SilentlyContinue
      - name: Compile installer and checksum with pinned compiler
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\tool\windows\installer\build.ps1 `
            -BuildDirectory build\windows\x64\runner\Release `
            -CompilerPath $compiler
      - name: Verify unsigned boundary and smoke test
        run: |
          $installer = Resolve-Path build\windows\installer\Pomodoist-Setup.exe
          $installerInfo = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($installer)
          $appPath = (Resolve-Path build\windows\x64\runner\Release\pomodoist.exe).Path
          $appInfo = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($appPath)
          if ($installerInfo.ProductVersion.Trim() -cne $env:POMODOIST_VERSION -or
              $appInfo.ProductVersion.Split('+')[0] -cne $env:POMODOIST_VERSION) {
            throw "Expected $env:POMODOIST_VERSION; application: '$($appInfo.ProductVersion)', installer: '$($installerInfo.ProductVersion)'."
          }
          $numericVersion = '{0}.{1}.{2}.{3}' -f $installerInfo.FileMajorPart,
              $installerInfo.FileMinorPart, $installerInfo.FileBuildPart, $installerInfo.FilePrivatePart
          if ($numericVersion -cne (($env:POMODOIST_VERSION -split '-', 2)[0] + '.0')) {
            throw 'Installer numeric version does not match the release version.'
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'NotSigned') {
            throw "Preview installer must remain unsigned; status was $($signature.Status)."
          }
          $expectedHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
          $checksum = (Get-Content -Raw "$installer.sha256").Trim()
          if ($checksum -cne "$expectedHash *Pomodoist-Setup.exe") {
            throw 'Installer checksum file does not match the release artifact.'
          }
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\tool\windows\installer\smoke.ps1 `
            -Installer $installer `
            -Interactive
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pomodoist-windows-exe
          path: |
            build/windows/installer/Pomodoist-Setup.exe
            build/windows/installer/Pomodoist-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish Windows EXE
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pomodoist-windows-exe
          path: release
      - name: Upload EXE and publish complete desktop release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_notes='Official Pomodoist desktop release. Linux is distributed as a portable x86_64 AppImage. The Windows installer is unsigned, so Microsoft Defender SmartScreen may warn about an unknown publisher.'
          prerelease=false
          latest=true
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then
            prerelease=true
            latest=false
          fi
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --prerelease="$prerelease" \
              --target "$GITHUB_SHA" \
              --title "Pomodoist $GITHUB_REF_NAME" \
              --notes "$release_notes" || \
              gh release view "$GITHUB_REF_NAME" > /dev/null
          fi
          gh release upload "$GITHUB_REF_NAME" \
            release/Pomodoist-Setup.exe \
            release/Pomodoist-Setup.exe.sha256 \
            --clobber
          release_id=$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
            --jq .id)
          required_assets=(
            Pomodoist-x86_64.AppImage
            Pomodoist-x86_64.AppImage.sha256
            Pomodoist-Setup.exe
            Pomodoist-Setup.exe.sha256
          )
          asset_names=$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
            --jq '.[].name')
          for required_asset in "${required_assets[@]}"; do
            if ! grep -Fqx -- "$required_asset" <<< "$asset_names"; then
              echo 'Release remains draft until all desktop assets are present.'
              exit 0
            fi
          done
          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            --field draft=false \
            --field prerelease="$prerelease" \
            --raw-field make_latest="$latest" \
            --silent
      - name: Publish manual GitHub pre-release
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-test.outputs.version }}
        run: |
          tag="windows-preview-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          notes=$(cat <<EOF
          Unsigned Windows preview. Microsoft Defender SmartScreen may warn about an unknown publisher.

          Download \`Pomodoist-Setup.exe\`, open it, and Pomodoist will install for the current user and start automatically. This x64 preview runs on x64 Windows 10/11 and through x64 compatibility on Windows 11 Arm64.

          Source commit: ${GITHUB_SHA}
          EOF
          )
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Pomodoist $VERSION Windows preview" \
            --notes "$notes" \
            release/Pomodoist-Setup.exe \
            release/Pomodoist-Setup.exe.sha256
