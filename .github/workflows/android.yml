name: Android validation

on:
  # Android packaging only breaks when Flutter sources or the Android tooling
  # change, so pull requests keep the path filter. Branch pushes do not build
  # Android at all: every main push that touched apps/ bought a 90-minute APK
  # build. Only release tags build it.
  pull_request:
    paths:
      - 'apps/flutter/**'
      - 'tool/android/**'
      - '.fvmrc'
      - '.github/workflows/android.yml'
  push:
    tags: ['v*.*.*']
  # workflow_call deliberately bypasses the path filter: the release lanes that
  # reuse this workflow (selfhost.yml, windows-exe-preview.yml) already decided
  # that a tagged build deserves the full smoke run.
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-validation-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && inputs.release_tag == '' }}

jobs:
  release-build-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
      - name: Test Android packaging and public configuration
        run: python3 -m unittest discover -s tool/android -p 'test_*.py' -v
      - name: Link Flutter build output into build/
        run: make flutter-build-link
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/flutter
      - name: Test Android runtime contracts
        working-directory: apps/flutter
        run: flutter test test/android_platform_test.dart
      - name: Prove release signing fails closed
        working-directory: apps/flutter
        run: |
          if flutter build apk --release --flavor production --target-platform android-arm64 \
              --dart-define=POMODOIST_BILLING_CHANNEL=storekit > "$RUNNER_TEMP/unsigned-build.log" 2>&1; then
            echo 'Release unexpectedly succeeded without signing credentials.' >&2
            exit 1
          fi
          if ! grep -q 'Android release signing is required' "$RUNNER_TEMP/unsigned-build.log"; then
            cat "$RUNNER_TEMP/unsigned-build.log"
            exit 1
          fi
      - name: Create disposable validation key (never a production key)
        run: |
          umask 077
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          export CI_KEY_PASSWORD="$password"
          keytool -genkeypair -noprompt -storetype JKS -keyalg RSA -keysize 2048 \
            -validity 2 -alias ci-validation -dname 'CN=Pomodoist CI Validation' \
            -keystore "$RUNNER_TEMP/android-validation.jks" \
            -storepass:env CI_KEY_PASSWORD -keypass:env CI_KEY_PASSWORD
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/android-validation.jks"
            echo "ANDROID_STORE_PASSWORD=$password"
            echo 'ANDROID_KEY_ALIAS=ci-validation'
            echo "ANDROID_KEY_PASSWORD=$password"
          } >> "$GITHUB_ENV"
      - name: Compile release APK and AAB without production account access
        working-directory: apps/flutter
        run: |
          # Every flavor is compiled and identity-verified with a disposable key,
          # so a flavor whose Gradle wiring or manifest is broken fails here
          # rather than at release time. Only the development flavor is launched
          # later: the staging and production runtime configurations need backend
          # credentials this workflow deliberately does not have.
          build_flavor() {
            local flavor=$1 target=$2
            shift 2
            local common=(--release "--flavor=$flavor" "--target=$target"
              --dart-define=POMODOIST_BILLING_CHANNEL=storekit
              "--dart-define=POMODOIST_RELEASE=$GITHUB_SHA" "$@")
            flutter build apk "${common[@]}"
            flutter build appbundle "${common[@]}"
            bash ../../tool/android/verify_artifacts.sh "$flavor"
          }
          build_flavor development lib/main_development.dart \
            --dart-define=POMODOIST_ENVIRONMENT=local \
            --dart-define=WEB_APP_URL=https://app.pomodoist.com
          build_flavor staging lib/main_staging.dart \
            --dart-define=POMODOIST_ENVIRONMENT=staging \
            --dart-define=WEB_APP_URL=https://app-test.pomodoist.com
          build_flavor production lib/main.dart \
            --dart-define=POMODOIST_ENVIRONMENT=production \
            --dart-define=WEB_APP_URL=https://app.pomodoist.com
      - name: Enable emulator acceleration
        if: ${{ github.ref_type == 'tag' || inputs.release_tag != '' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch and resume on Android 15
        if: ${{ github.ref_type == 'tag' || inputs.release_tag != '' }}
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tool/android/smoke_test.sh development
      - name: Save CI-only development APK and AAB
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-validation-development-NOT-FOR-DISTRIBUTION
          path: |
            build/flutter/app/outputs/flutter-apk/app-development-release.apk
            build/flutter/app/outputs/bundle/developmentRelease/app-development-release.aab
          if-no-files-found: error
          retention-days: 3
      - name: Save CI-only staging APK and AAB
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-validation-staging-NOT-FOR-DISTRIBUTION
          path: |
            build/flutter/app/outputs/flutter-apk/app-staging-release.apk
            build/flutter/app/outputs/bundle/stagingRelease/app-staging-release.aab
          if-no-files-found: error
          retention-days: 3
      - name: Save CI-only production APK and AAB
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-validation-NOT-FOR-DISTRIBUTION
          path: |
            build/flutter/app/outputs/flutter-apk/app-production-release.apk
            build/flutter/app/outputs/bundle/productionRelease/app-production-release.aab
          if-no-files-found: error
          retention-days: 3
      - name: Remove disposable signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/android-validation.jks" "$RUNNER_TEMP/unsigned-build.log"
