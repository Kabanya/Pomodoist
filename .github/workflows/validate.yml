name: Validate

on:
  pull_request:
  push:
    # Release candidates are cut from develop, so its test suite has to be
    # validated before a tag is pushed.
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
      - name: Install Linux native and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            appstream desktop-file-utils clang libgtk-layer-shell-dev \
            libc++-dev libc++abi-dev libdrm-dev libegl1-mesa-dev \
            libgl1-mesa-dev libgbm-dev libwayland-dev zlib1g-dev
      - run: sh tool/test_public_boundary.sh
      - run: sh tool/test_xcode_warnings.sh
      - run: python3 tool/check_architecture.py
      - run: python3 tool/deploy/web/check_build_contract.py
      - run: python3 -m unittest discover -s tool -p test_architecture.py
      - run: python3 -m unittest discover -s tool -p test_web_build_contract.py
      - run: python3 -m unittest discover -s tool -p test_web_image_ci.py
      - run: python3 -m unittest discover -s tool/windows -p 'test_*.py' -v
      - run: make test-linux-packaging
      - run: tool/linux/test_pomo_geometry.sh
      - run: python3 -m unittest discover -s tool/linux -p 'test_thermion*.py'
      - name: Link Flutter build output into build/
        run: make flutter-build-link
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/flutter
      - name: Check resolved Dart symbol boundaries
        run: dart run tool/check_architecture_types.dart
        working-directory: apps/flutter
      - run: python3 -m unittest discover -s tool -p test_release_notes.py
      - run: flutter analyze
        working-directory: apps/flutter
      - run: dart analyze tool
      - name: Exercise account recovery and restart fault scenarios
        working-directory: apps/flutter
        run: >-
          flutter test --no-pub --reporter json
          test/account_recovery_store_test.dart
          test/account_sync_reliability_test.dart
          test/account_sync_lifecycle_test.dart
          test/settings_sync_restart_test.dart
          test/domain/sync_account_use_case_test.dart
          > sync-reliability.json
      - name: Preserve machine-readable synchronization report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sync-reliability
          path: apps/flutter/sync-reliability.json
          if-no-files-found: ignore
      - run: flutter test
        working-directory: apps/flutter
      - name: Test browser voice recording storage
        shell: bash
        working-directory: apps/flutter
        run: |
          # Root-only CI runners cannot launch Chrome's sandbox. Keep normal
          # developer/non-root launches unchanged and scope this to this test.
          if [ "$(id -u)" -eq 0 ]; then
            chrome_binary="${CHROME_EXECUTABLE:-$(command -v google-chrome)}"
            printf '#!/bin/sh\nexec "%s" --no-sandbox "$@"\n' "$chrome_binary" > "$RUNNER_TEMP/chrome-voice-test"
            chmod +x "$RUNNER_TEMP/chrome-voice-test"
            export CHROME_EXECUTABLE="$RUNNER_TEMP/chrome-voice-test"
          fi
          flutter test --platform chrome test/web/voice_recording_store_test.dart
      - name: Compile web platform adapters
        working-directory: apps/flutter
        run: flutter build web --debug --target lib/main_development.dart
