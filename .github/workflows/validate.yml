name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
      - name: Install Linux packaging validators
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            appstream desktop-file-utils
      - run: sh tool/test_public_boundary.sh
      - run: make test-linux-packaging
      - run: flutter pub get --enforce-lockfile
      - run: python3 -m unittest discover -s tool -p test_release_notes.py
      - run: flutter analyze
      - run: flutter test
      - name: Test browser voice recording storage
        shell: bash
        run: |
          # Root-only CI runners cannot launch Chrome's sandbox. Keep normal
          # developer/non-root launches unchanged and scope this to this test.
          if [ "$(id -u)" -eq 0 ]; then
            chrome_binary="${CHROME_EXECUTABLE:-$(command -v google-chrome)}"
            printf '#!/bin/sh\nexec "%s" --no-sandbox "$@"\n' "$chrome_binary" > "$RUNNER_TEMP/chrome-voice-test"
            chmod +x "$RUNNER_TEMP/chrome-voice-test"
            export CHROME_EXECUTABLE="$RUNNER_TEMP/chrome-voice-test"
          fi
          flutter test --platform chrome test/web/voice_recording_store_test.dart
      - name: Compile web platform adapters
        run: flutter build web --debug
