name: Desktop updater

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/flutter/lib/**'
      - 'apps/flutter/test/**'
      - 'tool/test_desktop_update*'
      - '.github/workflows/desktop-updates.yml'
      - 'apps/flutter/pubspec.*'
      - '.fvmrc'
      - 'apps/flutter/windows/**'
      - 'apps/flutter/linux/**'

  push:
    branches: [develop]
    paths:
      - 'apps/flutter/lib/**'
      - 'apps/flutter/test/**'
      - 'tool/test_desktop_update*'
      - '.github/workflows/desktop-updates.yml'
      - 'apps/flutter/pubspec.*'
      - '.fvmrc'
      - 'apps/flutter/windows/**'
      - 'apps/flutter/linux/**'

permissions:
  contents: read

concurrency:
  group: desktop-updater-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  updater:
    name: Updater tests and ${{ matrix.platform }} build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: windows-2022
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Match the release toolchain: newer LLVM libunwind conflicts with
          # the GNU libunwind pkg-config metadata required by GStreamer.
          sudo apt-get install --yes --no-install-recommends \
            clang-12 cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libc++-12-dev libc++abi-12-dev libunwind-dev libdrm-dev libegl1-mesa-dev \
            libgl1-mesa-dev libgbm-dev zlib1g-dev \
            libsecret-1-dev libcurl4-openssl-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base
          pkg-config --print-errors --exists \
            gtk+-3.0 gstreamer-1.0 gstreamer-app-1.0 gstreamer-audio-1.0
          echo '/usr/lib/llvm-12/bin' >> "$GITHUB_PATH"
          printf '#include <type_traits>\n' | \
            /usr/lib/llvm-12/bin/clang++ -stdlib=libc++ -x c++ -fsyntax-only -
      - name: Execute Linux replacement and rollback scenarios
        if: runner.os == 'Linux'
        run: python3 -m unittest tool/test_desktop_update_helpers.py
      - name: Execute Windows installer and rollback scenarios
        if: runner.os == 'Windows'
        shell: powershell
        run: .\tool\test_desktop_update_windows.ps1
      - name: Link Flutter build output into build/
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File .\tool\windows\link-build.ps1
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/flutter
      - name: Test channels, popup, controller and verified downloads
        working-directory: apps/flutter
        run: >-
          flutter test
          test/desktop_update_release_test.dart
          test/desktop_update_controller_test.dart
          test/desktop_update_widgets_test.dart
          test/desktop_update_network_test.dart
          test/desktop_update_exit_test.dart
          test/desktop_update_helper_test.dart
          test/desktop_update_provider_test.dart
      - name: Compile native desktop application
        working-directory: apps/flutter
        run: >-
          flutter build ${{ matrix.platform }} --debug
          --flavor development
          --target lib/main_development.dart
