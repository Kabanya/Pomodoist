name: Android F-Droid build

on:
  pull_request:
    paths:
      - .fvmrc
      - .github/workflows/android-fdroid.yml
      - apps/flutter/android/**
      - apps/flutter/pubspec.*
      - tool/android/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-fdroid-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
      - name: Install Android build tools
        run: |
          sdkmanager=$(find -L "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit)
          if [[ ! -x "$sdkmanager" ]]; then
            echo 'Android cmdline-tools are missing from the runner SDK.' >&2
            exit 1
          fi
          "$sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - name: Test Android release tooling
        run: python3 -m unittest discover -s tool/android -p 'test_*.py'
      - name: Build unsigned APK
        run: bash tool/android/build_fdroid.sh
      - name: Verify package, version, billing permission and signing state
        run: |
          apk=build/flutter/android/fdroid/Pomodoist-FDroid-unsigned.apk
          tools="$ANDROID_HOME/build-tools/36.0.0"
          version=$(awk '/^version:/ {print $2; exit}' apps/flutter/pubspec.yaml)
          "$tools/aapt2" dump badging "$apk" > "$RUNNER_TEMP/fdroid-badging.txt"
          grep -F "package: name='com.finchforge.pomodoist.fdroid' versionCode='${version##*+}' versionName='${version%+*}'" \
            "$RUNNER_TEMP/fdroid-badging.txt"
          if grep -F 'com.android.vending.BILLING' "$RUNNER_TEMP/fdroid-badging.txt"; then
            echo 'The F-Droid APK requests the Google Play Billing permission.' >&2
            exit 1
          fi
          if "$tools/apksigner" verify "$apk"; then
            echo 'The F-Droid APK must be unsigned.' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pomodoist-fdroid-unsigned
          path: build/flutter/android/fdroid/Pomodoist-FDroid-unsigned.apk
          if-no-files-found: error
          retention-days: 7
