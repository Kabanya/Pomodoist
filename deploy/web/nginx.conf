pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  access_log /dev/stdout;
  error_log /dev/stderr warn;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  map $uri $pomodoist_cache_control {
    default "no-store";
    /main.dart.js "no-cache";
    "~*[0-9a-f]{16,}\.(?:js|css|png|jpe?g|gif|svg|webp|avif|woff2?|wasm)$" "public, max-age=31536000, immutable";
    ~*^/assets/ "no-cache";
  }

  map $uri $pomodoist_frame_ancestors {
    default "'self'";
    ~^/telegram(?:/|$) "'self' https://web.telegram.org https://*.telegram.org";
  }

  map $uri $pomodoist_x_frame_options {
    default "SAMEORIGIN";
    ~^/telegram(?:/|$) "";
  }

  map $uri $pomodoist_telegram_script_origin {
    default "";
    ~^/telegram(?:/|$) "https://telegram.org";
  }

  server {
    listen 8080;
    root /usr/share/nginx/html;

    include /tmp/pomodoist-security-headers.conf;
    add_header Cache-Control $pomodoist_cache_control always;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location = /.well-known/apple-app-site-association {
      access_log off;
      default_type application/json;
      try_files $uri =404;
    }

    location = /config.js {
      try_files $uri =404;
    }

    location = /version.json {
      try_files $uri =404;
    }

    location = /auth/challenge {
      access_log off;
      try_files /index.html =404;
    }

    location = /telegram {
      return 308 /telegram/;
    }

    location = /telegram/ {
      try_files /telegram/index.html =404;
    }

    location /telegram/ {
      try_files $uri =404;
    }

    location = /index.html {
      try_files $uri =404;
    }

    location = /flutter_service_worker.js {
      return 404;
    }

    location ~* \.(?:env|dart)$ {
      return 404;
    }

    location ~* \.map$ {
      return 404;
    }

    location ~* ^/(?:flutter_bootstrap\.js|main\.dart\.js|manifest\.json|asset-manifest\.json)$ {
      try_files $uri =404;
    }

    location ~* "[0-9a-f]{16,}\.(?:js|css|png|jpe?g|gif|svg|webp|avif|woff2?|wasm)$" {
      try_files $uri =404;
    }

    location /assets/ {
      try_files $uri =404;
    }

    location ~* \.(?:js|css|json|png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf|wasm|bin)$ {
      try_files $uri =404;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
